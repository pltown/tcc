[binaries]
c = 'clang-18'
cpp = 'clang++-18'
ar = 'llvm-ar-18'
strip = 'llvm-strip-18'
pkg-config = 'pkg-config'
cmake = 'cmake'
ninja = 'ninja'

[built-in options]
cpp_std = 'c++20'
buildtype = 'debug'

[properties]
# Helps Meson/CMake-based deps prefer LLVM 18 if anything uses CMake discovery.
pkg_config_path = '/usr/lib/llvm-18/lib/pkgconfig'
cmake_prefix_path = ['/usr/lib/llvm-18/lib/cmake']

